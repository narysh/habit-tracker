<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Вход в Habit Tracker</title>
<style>body{font:18px system-ui;background:#f7f9f5;color:#123d29;max-width:38rem;margin:15vh auto;padding:24px}main{padding:32px;border-radius:24px;background:#d5edde}p{line-height:1.6}</style></head>
<body><main><h1>Habit Tracker</h1><p id="status">Завершаем вход. Не закрывай страницу…</p></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try {
    const provider=location.pathname.split('/').filter(Boolean).at(-2);
    if(!['google','vk','yandex'].includes(provider)) throw Error();
    const input=new URLSearchParams(location.search), output=new URLSearchParams();
    if(!/^[A-Za-z0-9_-]{43}$/.test(input.get('state')||'')) throw Error();
    for(const key of ['state','code','error','device_id']) if(input.has(key)) output.set(key,input.get(key));
    if(!output.has('code')&&!output.has('error')) throw Error();
    const response=await fetch('https://raw.githubusercontent.com/narysh/habit-tracker/connection/connection.json?refresh='+Date.now(),{cache:'no-store',referrerPolicy:'no-referrer'});
    if(!response.ok) throw Error();
    const config=await response.json(), target=new URL(config.url);
    if(target.protocol!=='https:'||target.username||target.password||target.search||target.hash||target.pathname!=='/') throw Error();
    location.replace(target.origin+'/auth/social/'+provider+'/callback?'+output);
  } catch {status.textContent='Не удалось связаться с сервером. Вернись в приложение и повтори вход. Компьютер с сервером должен быть включён.';}
})();
</script></body></html>
