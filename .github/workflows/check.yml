name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_task_page.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/test_public_plugin.py
      - name: Validate ChatGPT plugin package metadata
        run: pwsh -File scripts/Test-ChatGPT-PluginPackage.ps1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :shared:test :backend:test :mcp-probe:test
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-probe-test-report
          path: |
            shared/build/reports/tests/test
            backend/build/reports/tests/test
            mcp-probe/build/reports/tests/test
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools emulator'
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release builds require a stable server and signing key
        shell: bash
        run: |
          set +e
          no_origin=$(bash gradlew :android-app:assembleRelease --no-daemon 2>&1)
          no_origin_status=$?
          set -e
          if [ "$no_origin_status" -eq 0 ] || ! grep -Fq 'A release artifact requires -PhabitTrackerOrigin with the stable production HTTPS origin' <<< "$no_origin"; then
            printf '%s\n' "$no_origin"
            echo 'Release build did not reject a missing backend origin.'
            exit 1
          fi
          set +e
          no_signing=$(bash gradlew :android-app:assembleRelease --no-daemon -PhabitTrackerOrigin=https://tracker.example.org 2>&1)
          no_signing_status=$?
          set -e
          if [ "$no_signing_status" -eq 0 ] || ! grep -Fq 'A release artifact requires the persistent HABIT_TRACKER_SIGNING_* key' <<< "$no_signing"; then
            printf '%s\n' "$no_signing"
            echo 'Release build did not reject a missing signing key.'
            exit 1
          fi
          set +e
          no_version=$(HABIT_TRACKER_SIGNING_STORE_FILE="$RUNNER_TEMP/dummy.jks" HABIT_TRACKER_SIGNING_STORE_PASSWORD=test HABIT_TRACKER_SIGNING_KEY_ALIAS=test HABIT_TRACKER_SIGNING_KEY_PASSWORD=test bash gradlew :android-app:assembleRelease --no-daemon -PhabitTrackerOrigin=https://tracker.example.org --dry-run 2>&1)
          no_version_status=$?
          set -e
          if [ "$no_version_status" -eq 0 ] || ! grep -Fq 'A release artifact requires -PhabitTrackerReleaseVersion with a stable version such as 1.0.0' <<< "$no_version"; then
            printf '%s\n' "$no_version"
            echo 'Release build did not reject a preview or missing version.'
            exit 1
          fi
      - run: bash gradlew :android-app:assembleDebug :android-app:lintDebug
      - name: Start disposable Android emulator
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/habit-avd"
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name habit-ci --package 'system-images;android-36;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx habit-ci
          "$ANDROID_HOME/emulator/emulator" -avd habit-ci -accel on -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > "$RUNNER_TEMP/habit-emulator.log" 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > "$RUNNER_TEMP/habit-emulator.pid"
          device_ready=false
          device_deadline=$((SECONDS + 300))
          while (( SECONDS < device_deadline )); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/habit-emulator.log"
              exit 1
            fi
            if [ "$(adb -s emulator-5554 get-state 2>/dev/null | tr -d '\r')" = "device" ]; then device_ready=true; break; fi
            sleep 1
          done
          if [ "$device_ready" != true ]; then
            cat "$RUNNER_TEMP/habit-emulator.log"
            echo 'Android emulator did not appear in adb within 300 seconds.'
            exit 1
          fi
          boot_completed=false
          boot_deadline=$((SECONDS + 300))
          while (( SECONDS < boot_deadline )); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/habit-emulator.log"
              exit 1
            fi
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then boot_completed=true; break; fi
            sleep 1
          done
          if [ "$boot_completed" != true ]; then
            cat "$RUNNER_TEMP/habit-emulator.log"
            echo 'Android emulator did not finish booting within 300 seconds.'
            exit 1
          fi
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
      - name: Run Android integration tests against disposable backend
        run: |
          mkdir -p .local
          bash gradlew :backend:runFeatureTests --no-daemon > "$RUNNER_TEMP/feature-backend.log" 2>&1 &
          backend_pid=$!
          cleanup() {
            kill "$backend_pid" 2>/dev/null || true
            wait "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:18082/readyz > /dev/null; then ready=true; break; fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/feature-backend.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/feature-backend.log"
            exit 1
          fi
          bash gradlew :android-app:connectedDebugAndroidTest --no-daemon \
            '-Pandroid.testInstrumentationRunnerArguments.backend_url=http://10.0.2.2:18082' \
            '-Pandroid.testInstrumentationRunnerArguments.class=dev.habittracker.android.FeatureIntegrationTest#reminderPermissionIsRequestedAfterSavingAndDeferringKeepsTheTask'
          bash gradlew :android-app:connectedDebugAndroidTest \
            --no-daemon \
            '-Pandroid.testInstrumentationRunnerArguments.backend_url=http://10.0.2.2:18082' \
            '-Pandroid.testInstrumentationRunnerArguments.class=dev.habittracker.android.IntegrationTest,dev.habittracker.android.FeatureIntegrationTest,dev.habittracker.android.AuthFlowTest'
      - name: Upload Android integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-android-instrumentation
          path: android-app/build/outputs/androidTest-results/connected
          if-no-files-found: ignore
      - name: Stop disposable Android emulator
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/habit-emulator.pid" ]; then
            emulator_pid=$(cat "$RUNNER_TEMP/habit-emulator.pid")
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
          fi
          adb -s emulator-5554 emu kill 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/habit-emulator.log" ]; then cat "$RUNNER_TEMP/habit-emulator.log"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-debug
          path: android-app/build/outputs/apk/debug/*.apk
  chatgpt-sites-pilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
