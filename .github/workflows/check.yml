name: Check
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :shared:test :backend:test :mcp-probe:test
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-probe-test-report
          path: |
            shared/build/reports/tests/test
            backend/build/reports/tests/test
            mcp-probe/build/reports/tests/test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :android-app:assembleDebug :android-app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-debug
          path: android-app/build/outputs/apk/debug/*.apk
