name: Auth callback pages
on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare callback and task routes
        run: |
          mkdir -p _site
          cp web/callback.html _site/index.html
          for provider in google vk yandex; do
            mkdir -p "_site/auth/social/$provider/callback"
            cp web/callback.html "_site/auth/social/$provider/callback/index.html"
          done
          mkdir -p _site/task
          cp web/task.html _site/task/index.html
          cp web/task.js _site/task/task.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
